<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Wompout verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#151a21;font-family:'Avenir Next',Avenir,'Segoe UI',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
    style="background-color:#151a21;">
    <tr>
      <td align="center" valign="bottom" height="210"
        background="https://api.wompout.com/images/thumbnail.png"
        style="height:210px;background-color:#1d222b;background-image:url('https://api.wompout.com/images/thumbnail.png');background-position:center 48%;background-size:cover;background-repeat:no-repeat;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td align="center" style="padding:112px 16px 0;background-image:linear-gradient(to bottom,rgba(21,26,33,0) 45%,#151a21 100%);">
              <img
                src="https://api.wompout.com/images/logo.png"
                alt=""
                width="144"
                style="display:block;width:144px;max-width:100%;height:auto;border:0;color:#ffffff;"
              >
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding:20px 16px 40px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
          style="max-width:480px;">

          <tr>
            <td align="center"
              style="padding:8px 24px 0;">

              <h1 style="margin:0;color:#3d70ff;font-family:'Avenir Next','Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif;font-size:32px;line-height:42px;font-weight:900;letter-spacing:-0.7px;text-shadow:-2px -2px 0 #000000,0 -2px 0 #000000,2px -2px 0 #000000,-2px 0 0 #000000,2px 0 0 #000000,-2px 2px 0 #000000,0 2px 0 #000000,2px 2px 0 #000000,0 5px 0 #000000;">
                Ready to Womp?
              </h1>

              <p style="margin:12px 0 24px;color:#ffffff;font-size:15px;line-height:24px;font-weight:500;">
                Enter this verification code in the app<br>
                to jump into the action.
              </p>

            </td>
          </tr>

          <tr>
            <td align="center" style="padding:0 8px 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                style="max-width:320px;border-collapse:separate;">
                <tr>
                  <td align="center"
                    style="padding:22px 16px 20px;background-color:#1d222b;border:4px solid #000000;border-radius:16px;box-shadow:0 5px 0 #000000;">
                    <p style="margin:0 0 10px;color:#3d70ff;font-size:10px;line-height:16px;font-weight:bold;letter-spacing:1.8px;">
                      YOUR VERIFICATION CODE
                    </p>
                    <p style="margin:0;color:#ffffff;font-family:'Avenir Next','Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif;font-size:38px;line-height:48px;font-weight:900;letter-spacing:5px;font-variant-numeric:tabular-nums;text-shadow:-1px -1px 0 #000000,1px -1px 0 #000000,-1px 1px 0 #000000,1px 1px 0 #000000,0 3px 0 #000000;">
                      {{CODE}}
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
